apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn-helm
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/infra/longhorn
  prune: true
  wait: true
  targetNamespace: longhorn-system
  commonMetadata:
    labels: { app: longhorn }
  dependsOn: []
  patches:
    - target:
        kind: HelmRelease
        name: longhorn
      patch: |-
        - op: add
          path: /spec/install/disableWait
          value: false
